<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title> TMSTH Premium Document</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css">

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <!-- HTML Sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>

<body>
  <div class="layout">

    <aside class="sidebar">      
      <h2>MNPG Document</h2>       
      <!-- เมนูจะถูกสร้างจาก app.js อัตโนมัติ -->      
       <div id="doc-menu">        Loading menu...      </div>    
    </aside>

    <main class="content">
      <div id="markdown-content">
        Loading...
      </div>
    </main>

     <!-- Back to top button -->
    <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-danger btn-floating btn-lg" id="btn-back-to-top">
      TOP <i class="fas fa-arrow-up"></i>
    </button>


  </div>

 

  <script> 
      //Get the button
      let mybutton = document.getElementById("btn-back-to-top");

      // When the user scrolls down 20px from the top of the document, show the button
      window.onscroll = function () {
      scrollFunction();
      };

      function scrollFunction() {
      if (
      document.body.scrollTop > 20 ||
      document.documentElement.scrollTop > 20
      ) {
      mybutton.style.display = "block";
      } else {
      mybutton.style.display = "none";
      }
      }
      // When the user clicks on the button, scroll to the top of the document
      mybutton.addEventListener("click", backToTop);

      function backToTop() {
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
      }
  </script>

  <!-- Application Script -->
  <script src="./app.js"></script>
  <!-- <script src="./app.js"></script> -->

</body>
</html>
